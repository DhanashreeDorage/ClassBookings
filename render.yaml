services:
  - type: web
    name: classbookings
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: royaltica-classbookings-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: royaltica-classbookings-db
    databaseName: royaltica_classbookings
    user: royaltica_app
    plan: free
    region: ohio
