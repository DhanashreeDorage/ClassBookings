databases:
  - name: royaltica-bookings-db
    plan: 0.1c-256mb
    region: ohio
    databaseName: royaltica_bookings
    user: royaltica_app

services:
  - type: web
    name: royaltica-morning-class
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: royaltica-bookings-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
